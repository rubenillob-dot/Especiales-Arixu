<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 26" width="96" height="52" style="image-rendering: pixelated; shape-rendering: crispEdges;">
  <!-- Sombra en suelo -->
  <ellipse cx="24" cy="24" rx="18" ry="2" fill="rgba(0,0,0,0.4)" />
  
  <!-- Colita que se mueve -->
  <g class="simba-tail">
    <rect x="2" y="7" width="2" height="3" fill="#14151B" />
    <rect x="4" y="9" width="2" height="3" fill="#1E2028" />
    <rect x="6" y="11" width="3" height="3" fill="#252732" />
  </g>

  <!-- Cuerpo alargado salchicha (Teckel Negro) -->
  <!-- Capa trasera/sombra profunda -->
  <rect x="8" y="11" width="24" height="9" fill="#101116" />
  <!-- Cuerpo principal charcoal/negro -->
  <rect x="9" y="10" width="23" height="9" fill="#1A1C24" />
  <rect x="11" y="9" width="19" height="9" fill="#262834" />
  <rect x="13" y="9" width="15" height="2" fill="#3D4050" /> <!-- Brillo superior pelaje negro sedoso -->
  <rect x="10" y="17" width="21" height="2" fill="#0C0D11" /> <!-- Sombra panza -->

  <!-- Patitas traseras -->
  <g class="simba-back-legs">
    <rect x="10" y="19" width="3" height="4" fill="#0E0F14" class="simba-leg-back-1" />
    <rect x="14" y="19" width="3" height="4" fill="#22242F" class="simba-leg-back-2" />
  </g>

  <!-- Patitas delanteras -->
  <g class="simba-front-legs">
    <rect x="27" y="19" width="3" height="4" fill="#0E0F14" class="simba-leg-front-1" />
    <rect x="31" y="19" width="3" height="4" fill="#22242F" class="simba-leg-front-2" />
  </g>

  <!-- Pecho y Cuello -->
  <rect x="29" y="8" width="6" height="8" fill="#262834" />
  <rect x="30" y="7" width="5" height="4" fill="#1A1C24" />

  <!-- Collar Twitch Oficial -->
  <rect x="30" y="12" width="4" height="2" fill="#9146FF" />
  <rect x="31" y="14" width="2" height="2" fill="#FFD166" /> <!-- Chapita dorada Twitch -->

  <!-- Cabeza de Teckel Negro -->
  <rect x="31" y="4" width="10" height="9" fill="#1A1C24" />
  <rect x="33" y="3" width="7" height="9" fill="#262834" />
  <rect x="34" y="2" width="5" height="2" fill="#3D4050" /> <!-- Brillo cabeza -->

  <!-- Hocico alargado -->
  <rect x="39" y="8" width="6" height="5" fill="#262834" />
  <rect x="41" y="9" width="4" height="3" fill="#1A1C24" />
  <rect x="44" y="8" width="3" height="2" fill="#060608" /> <!-- Trufa / Nariz negra -->
  <rect x="41" y="12" width="3" height="1" fill="#0B0C10" /> <!-- Sonrisa sutil -->

  <!-- Ojo pixelado -->
  <rect x="36" y="5" width="3" height="3" fill="#060608" />
  <rect x="36" y="5" width="1" height="1" fill="#FFFFFF" /> <!-- Brillo ojo blanco -->

  <!-- Oreja larga caída negra terciopelo -->
  <g class="simba-ear">
    <rect x="31" y="4" width="3" height="2" fill="#101116" />
    <rect x="30" y="6" width="4" height="7" fill="#101116" />
    <rect x="31" y="13" width="2" height="2" fill="#08090C" />
  </g>
</svg>
